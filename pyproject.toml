[project]
name = "picogpt"
version = "0.1.0"
description = "A minimal GPT-2 implementation in NumPy"
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
    "numpy==1.24.1",
    "regex==2024.11.6",
    "requests==2.27.1",
    "tqdm==4.64.0",
    "fire==0.5.0",
    "tensorflow==2.11.0; sys_platform != 'win32' and (sys_platform != 'darwin' or platform_machine != 'arm64')",
    "tensorflow-intel==2.11.0; sys_platform == 'win32'",
    "tensorflow-macos==2.11.0; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[tool.uv]
package = false
constraint-dependencies = [
    "tensorflow-io-gcs-filesystem==0.31.0; sys_platform == 'win32'",
]
